name: Task Progression
on:
  issues:
    types: [assigned]
jobs:
  move-task:
    runs-on: ubuntu-latest
    steps:
      - name: Update Project Board
        # Used to be uses: actions/add-to-project@v1, now use the one below
        uses: actions/add-to-project@v1.0.2
        with:
          # github-token: ${{ secrets.GITHUB_TOKEN }}
          # project-url: https://github.com/users/Lithub960/projects/6
          project_id: 6
          column_name: "In Progress"
          
