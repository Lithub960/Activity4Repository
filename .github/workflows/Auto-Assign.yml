name: Auto-Assign Labels
on:
  issues:
    types: [opened]

# Copilot recommended fix below:
permissions:
  issues: write
  pull-requests: write
    
jobs:
  assign-label:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: "Bug"
