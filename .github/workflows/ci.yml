name: CI Workflow

on:
  push:
    branches:
    - main

# concurrency:
#   group: main-${{ github.ref }}
#   cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Check Docker Hub Secrets are available
      shell: bash
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
       if [[ -n "$DOCKER_USERNAME" ]]; then
          echo "DOCKER_USERNAME is set 
        else
          echo "DOCKER_USERNAME is empty"
        fi
      
        if [[ -n "$DOCKER_PASSWORD" ]]; then 
          echo "DOCKER_PASSWORD is set 
        else
          echo "DOCKER_PASSWORD is empty"
        fi
       
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t vowel-frequency-analyzer:latest .
        docker build -t d0c4g1thub730/my-app:latest  .

    - name: Run Docker container
      run: |
        docker run --rm \
          -e "GITHUB_USER=${{github.actor}}"\
          vowel-frequency-analyzer:latest


    - name: Push Docker Image
      run: |
        docker push d0c4g1thub730/my-app:latest

    - name: Deploy Docker
      run: |
          docker run -d --name my-app -p 5000:5000 d0c4g1thub730/my-app:latest
