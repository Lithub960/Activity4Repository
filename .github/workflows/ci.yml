name: CI Workflow - Docker

on:
  push:
    branches:
    - main
    
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Check Docker Hub Secrets are available
      shell: bash
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
       if [[ -n "$DOCKER_USERNAME" ]]; then
          echo "DOCKER_USERNAME is set 
        else
          echo "DOCKER_USERNAME is empty"
        fi
      
        if [[ -n "$DOCKER_PASSWORD" ]]; then 
          echo "DOCKER_PASSWORD is set 
        else
          echo "DOCKER_PASSWORD is empty"
        fi
       
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t task-manager:latest .

## Only uncomment it if needed, otherwise, use the below code that is unhighlighted

    # - name: Run Docker container
    #   run: |
    #     docker run --rm \
    #       -e "GITHUB_USER=${{github.actor}}"\
    #       task-manager:latest

    - name: Create task summary file
      run: |
          cat > /tmp/tasks.txt <<'EOF'
          ToDo Tasks:
          - Review PR
          - Update docs
          - Fix CI

          Done Tasks:
          - Initial setup
          EOF

    - name: Run unit tests
      id: tests
      continue-on-error: true
      run: |
        python -m pip install pytest
        if python -m pytest -q > /tmp/unittest.txt 2>&1; then
          cat /tmp/unittest.txt
        else
          cat /tmp/unittest.txt
          exit 1
        fi

    - name: Fail workflow if tests failed
      if: steps.tests.outcome == 'failure'
      run: exit 1

    - name: Update index.html
      env:
        GITHUB_USER: ${{ github.actor }}
        FREQ_RESULT: "pass"
        TIMESTAMP: ${{ github.run_started_at }}
      run: |
        export TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        bash .github/scripts/update_index.sh /tmp/tasks.txt /tmp/unittest.txt
