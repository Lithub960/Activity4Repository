name: CI Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Check Docker Hub Secrets are available
      shell: bash
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
       [[ -n "$DOCKER_USERNAME" ]] && echo "DOCKER_USERNAME is set || echo "DOCKER_USERNAME is empty"
       [[ -n "$DOCKER_PASSWORD" ]] && echo "DOCKER_PASSWORD is set || echo "DOCKER_PASSWORD is empty"
       
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t vowel-frequency-analyzer:latest .
        docker build -t D0c4G1thub730/my-app:latest  .

    - name: Run Docker container
      run: |
        docker run --rm \
          -e "GITHUB_USER=${{github.actor}}"\
          vowel-frequency-analyzer:latest
        docker run D0c4G1thub730/my-app:latest

    - name: Push Docker Image
      run: |
        docker push D0c4G1thub730/my-app:latest

    - name: Deploy Docker
      run: |
        docker compose up -d D0c4G1thub730/my-app:latest
